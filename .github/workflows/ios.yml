# App Store paketi: GitHub'ın Mac makinesinde derlenir, imzalanır ve TestFlight'a yüklenir (Mac gerekmez).
# Elle başlatılır: GitHub › Actions › "iOS paketi" › Run workflow.
# Bir kez yapılacak ayar (Settings › Secrets and variables › Actions › New repository secret):
#   APPLE_TAKIM_KIMLIGI   Team ID (developer.apple.com › Membership details, 10 karakter)
#   ASC_YAYINCI_KIMLIGI   App Store Connect › Users and Access › Integrations › App Store Connect API › Issuer ID
#   ASC_ANAHTAR_KIMLIGI   aynı sayfada oluşturulan anahtarın Key ID'si (erişim: Admin)
#   ASC_ANAHTAR_P8        indirilen AuthKey_XXXX.p8 dosyasının içeriği (BEGIN/END satırlarıyla)
# İmza sertifikası ve profil Apple'ın bulut imzasıyla kendiliğinden oluşturulur (-allowProvisioningUpdates).
# Derleme numarası çalıştırma numarasıdır, sürüm package.json › version.
name: iOS paketi

on:
  workflow_dispatch:
  push:
    branches: ['ozellik/magaza-*']

permissions:
  contents: read

concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  paketle:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: En yeni Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Seçilen: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - run: npm test
      - run: npm run kanca
      - run: npm run build
      - run: npx cap sync ios
      - name: App Store Connect anahtarı
        env:
          P8: ${{ secrets.ASC_ANAHTAR_P8 }}
          KEY_ID: ${{ secrets.ASC_ANAHTAR_KIMLIGI }}
        run: |
          echo "SURUM=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          if [ -z "$P8" ]; then echo "::warning::ASC_ANAHTAR_P8 yok: imzasız deneme derlemesi (MAGAZA.md)"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8"
          echo "ASC_P8_YOLU=$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Deneme derlemesi (imzasız)
        if: env.ASC_P8_YOLU == ''
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Arşivle
        if: env.ASC_P8_YOLU != ''
        env:
          TAKIM: ${{ secrets.APPLE_TAKIM_KIMLIGI }}
          KEY_ID: ${{ secrets.ASC_ANAHTAR_KIMLIGI }}
          ISSUER: ${{ secrets.ASC_YAYINCI_KIMLIGI }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_YOLU" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TAKIM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$SURUM" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
      - name: TestFlight'a yükle
        if: env.ASC_P8_YOLU != ''
        env:
          TAKIM: ${{ secrets.APPLE_TAKIM_KIMLIGI }}
          KEY_ID: ${{ secrets.ASC_ANAHTAR_KIMLIGI }}
          ISSUER: ${{ secrets.ASC_YAYINCI_KIMLIGI }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TAKIM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/cikti" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_P8_YOLU" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
