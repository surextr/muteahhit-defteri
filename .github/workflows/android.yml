# Google Play paketi (imzalı .aab). Elle başlatılır: GitHub › Actions › "Android paketi" › Run workflow.
# Bir kez yapılacak ayar (Settings › Secrets and variables › Actions › New repository secret):
#   ANDROID_KEYSTORE_B64     yükleme anahtarı dosyasının (muteahhit-yukleme.jks) base64 metni
#   ANDROID_KEYSTORE_SIFRESI anahtar dosyasının şifresi
#   ANDROID_ANAHTAR_ADI      anahtar adı (alias)
#   ANDROID_ANAHTAR_SIFRESI  anahtar şifresi (PKCS12'de dosya şifresiyle aynı)
#   PLAY_HIZMET_HESABI       (isteğe bağlı) Play Console API hizmet hesabı JSON'u; varsa paket "Dahili test"e
#                            taslak olarak yüklenir. İlk paket Play Console'dan elle yüklenmelidir (Google kuralı).
# Sürüm kodu çalıştırma numarasıdır (her pakette artar), sürüm adı package.json › version.
name: Android paketi

on:
  workflow_dispatch:
  push:
    branches: ['ozellik/magaza-*']

permissions:
  contents: read

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  paketle:
    runs-on: ubuntu-latest
    env:
      SURUM_KODU: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Sürüm adı
        run: echo "SURUM_ADI=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Yükleme anahtarı
        env:
          ANAHTAR: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANAHTAR" ]; then echo "::warning::ANDROID_KEYSTORE_B64 yok: imzasız deneme paketi (MAGAZA.md)"; exit 0; fi
          echo "$ANAHTAR" | base64 -d > "$RUNNER_TEMP/yukleme.jks"
          echo "ANDROID_KEYSTORE_DOSYASI=$RUNNER_TEMP/yukleme.jks" >> "$GITHUB_ENV"
      - name: Paketi derle (.aab)
        working-directory: android
        env:
          ANDROID_KEYSTORE_SIFRESI: ${{ secrets.ANDROID_KEYSTORE_SIFRESI }}
          ANDROID_ANAHTAR_ADI: ${{ secrets.ANDROID_ANAHTAR_ADI }}
          ANDROID_ANAHTAR_SIFRESI: ${{ secrets.ANDROID_ANAHTAR_SIFRESI }}
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: muteahhit-android-${{ env.SURUM_ADI }}-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Play hizmet hesabı var mı
        id: play
        env:
          HESAP: ${{ secrets.PLAY_HIZMET_HESABI }}
        run: echo "var=$([ -n "$HESAP" ] && echo evet || echo hayir)" >> "$GITHUB_OUTPUT"
      - name: Google Play › Dahili test (taslak)
        if: steps.play.outputs.var == 'evet' && env.ANDROID_KEYSTORE_DOSYASI != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_HIZMET_HESABI }}
          packageName: tr.surex.muteahhit
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
