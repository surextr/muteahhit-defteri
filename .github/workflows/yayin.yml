# master dalına her gönderimde: testler, derleme ve FTP ile https://muteahhit.surex.tr yayını.
# Bir kez yapılacak ayar (GitHub › Settings › Secrets and variables › Actions › New repository secret):
#   FTP_SUNUCU     ftp.surex.tr (ya da cPanel'in gösterdiği FTP sunucusu)
#   FTP_KULLANICI  cPanel › FTP Hesapları'nda muteahhit.surex.tr klasörüne açılan hesap
#   FTP_SIFRE      o hesabın şifresi
# FTP hesabı doğrudan alt alan adının klasörüne açıldığı için yükleme kök klasöre (./) yapılır.
# Sunucu ayar dosyası (muteahhit-ayarlar.php) web klasörünün dışındadır; yayın ona dokunmaz.
name: Yayın

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Aynı anda tek yayın; yenisi gelince yarımdaki iptal edilmez, sıraya girer.
concurrency:
  group: yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: React kanca kuralları
        run: npm run kanca
      - name: PHP söz dizimi denetimi
        run: find sunucu -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: npm run build
      - name: API'yi derlemeye ekle
        run: cp -r sunucu/api dist/api
      - name: FTP ile yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SUNUCU }}
          username: ${{ secrets.FTP_KULLANICI }}
          password: ${{ secrets.FTP_SIFRE }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
